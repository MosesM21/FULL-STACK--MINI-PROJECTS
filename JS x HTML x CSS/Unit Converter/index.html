<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter — Metric &amp; Imperial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">

        <header class="app__head">
            <div>
                <h1>Unit Converter</h1>
                <p class="subtitle">Metric &amp; Imperial, both ways at once</p>
            </div>
            <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2v2.6M12 19.4V22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M2 12h2.6M19.4 12H22M4.9 19.1l1.9-1.9M17.2 6.8l1.9-1.9"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/>
                </svg>
            </button>
        </header>

        <!-- INPUT CARD -->
        <section class="hero">
            <label class="hero__label" for="input-value">Enter a value</label>

            <div class="hero__field">
                <input
                    type="number"
                    id="input-value"
                    inputmode="decimal"
                    step="any"
                    placeholder="0"
                    autocomplete="off"
                    aria-describedby="input-error">
            </div>

            <p id="input-error" class="hero__error" role="alert" hidden>Please enter a valid number.</p>

            <div class="hero__actions">
                <button id="convert-btn" class="btn btn--solid" type="button">Convert</button>
                <button id="clear-btn" class="btn btn--ghost" type="button">Clear</button>
            </div>
        </section>

        <!-- RESULTS -->
        <section class="results is-empty" id="results" aria-live="polite">

            <article class="card">
                <header class="card__head">
                    <span class="card__icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.8 14.4 14.4 2.8a1 1 0 0 1 1.4 0l5.4 5.4a1 1 0 0 1 0 1.4L9.6 21.2a1 1 0 0 1-1.4 0l-5.4-5.4a1 1 0 0 1 0-1.4z"/>
                            <path d="M7 10.2 8.8 12M10.2 7 12 8.8M13.4 3.8l1.8 1.8"/>
                        </svg>
                    </span>
                    <h2>Length</h2>
                    <span class="card__badge">m &harr; ft</span>
                </header>

                <div class="card__rows">
                    <button class="row" type="button" data-copy>
                        <span class="row__side"><b data-out="len-in">0</b><small>meters</small></span>
                        <span class="row__arrow" aria-hidden="true">&rarr;</span>
                        <span class="row__side row__side--to"><b data-out="len-ft">0</b><small>feet</small></span>
                    </button>
                    <button class="row" type="button" data-copy>
                        <span class="row__side"><b data-out="len-in2">0</b><small>feet</small></span>
                        <span class="row__arrow" aria-hidden="true">&rarr;</span>
                        <span class="row__side row__side--to"><b data-out="len-m">0</b><small>meters</small></span>
                    </button>
                </div>
            </article>

            <article class="card">
                <header class="card__head">
                    <span class="card__icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 2h6M10 2v6.2L5.4 17a3 3 0 0 0 2.6 4.5h8a3 3 0 0 0 2.6-4.5L14 8.2V2"/>
                            <path d="M7.2 14.5h9.6"/>
                        </svg>
                    </span>
                    <h2>Volume</h2>
                    <span class="card__badge">L &harr; gal</span>
                </header>

                <div class="card__rows">
                    <button class="row" type="button" data-copy>
                        <span class="row__side"><b data-out="vol-in">0</b><small>liters</small></span>
                        <span class="row__arrow" aria-hidden="true">&rarr;</span>
                        <span class="row__side row__side--to"><b data-out="vol-gal">0</b><small>gallons</small></span>
                    </button>
                    <button class="row" type="button" data-copy>
                        <span class="row__side"><b data-out="vol-in2">0</b><small>gallons</small></span>
                        <span class="row__arrow" aria-hidden="true">&rarr;</span>
                        <span class="row__side row__side--to"><b data-out="vol-l">0</b><small>liters</small></span>
                    </button>
                </div>
            </article>

            <article class="card">
                <header class="card__head">
                    <span class="card__icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3.2a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z"/>
                            <path d="M9.9 6.6H6.4L3.4 20a1 1 0 0 0 1 1.2h15.2a1 1 0 0 0 1-1.2l-3-13.4h-3.5"/>
                        </svg>
                    </span>
                    <h2>Mass</h2>
                    <span class="card__badge">kg &harr; lb</span>
                </header>

                <div class="card__rows">
                    <button class="row" type="button" data-copy>
                        <span class="row__side"><b data-out="mass-in">0</b><small>kilograms</small></span>
                        <span class="row__arrow" aria-hidden="true">&rarr;</span>
                        <span class="row__side row__side--to"><b data-out="mass-lb">0</b><small>pounds</small></span>
                    </button>
                    <button class="row" type="button" data-copy>
                        <span class="row__side"><b data-out="mass-in2">0</b><small>pounds</small></span>
                        <span class="row__arrow" aria-hidden="true">&rarr;</span>
                        <span class="row__side row__side--to"><b data-out="mass-kg">0</b><small>kilograms</small></span>
                    </button>
                </div>
            </article>

        </section>

        <p class="hint">Tip: results update as you type &mdash; click any row to copy it.</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
