<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>StockTicker</title>
</head>
<body>
    <div class="container">
        <p>
            Name: <span id="stock-name"></span>
        </p>
        <p>
            Symbol: <span id="stock-symbol"></span>
        </p>
        <p>
            Price: <span  id="stock-price"></span>
            <div id="stock-state-arrow">arrow</div>
        </p>
        <p>
            Time: <span id="time"></span>
        </p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
